version: '3.8'

services:
  gfp-design:
    build: .
    container_name: gfp-design-pipeline
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./scripts:/app/scripts
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: bash run_pipeline.sh

  # 可选：Jupyter服务
  jupyter:
    build: .
    container_name: gfp-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
